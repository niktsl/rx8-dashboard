name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and assemble debug
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --continue --console=plain :core:test :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Summarize compiler errors
        if: failure()
        shell: bash
        run: |
          {
            echo '### Compiler errors / failures'
            echo '```'
            grep -E '^(e: |w: .*(deprecat|unchecked)|.*FAILED$|.*> (Task|There were failing))' build.log | sort -u | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | sort -u | head -150 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rx8-dash-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    # Runs only on manual dispatch / push to main AND when signing secrets exist.
    needs: debug
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        id: guard
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; skipping release build."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.guard.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble unsigned release
        if: steps.guard.outputs.enabled == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign release APK
        if: steps.guard.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          IN=$(ls app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null | head -n1 || true)
          [ -z "$IN" ] && IN=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$IN" dist/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out dist/rx8-dash-release.apk dist/aligned.apk
          "$BT/apksigner" verify dist/rx8-dash-release.apk
          rm -f "$KS" dist/aligned.apk

      - name: Upload signed release APK
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rx8-dash-release
          path: dist/rx8-dash-release.apk
          if-no-files-found: error
